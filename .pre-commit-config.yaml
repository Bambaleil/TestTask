default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Strict typing
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml|uv\.lock)
      - id: tests
        name: Unit tests before push
        entry: uv run --frozen pytest -m "not integration" -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: documentation
        name: Documentation before push
        entry: uv run --frozen --group docs mkdocs build --strict
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(docs/|src/|mkdocs\.yml|CHANGELOG\.md)
