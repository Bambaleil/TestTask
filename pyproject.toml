[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "payment-service"
version = "0.4.0"
description = "Асинхронный сервис процессинга платежей с Outbox и RabbitMQ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1",
  "faststream[rabbit]>=0.6,<0.8",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
]

[project.scripts]
payment-api = "payment_service.server:main"
payment-worker = "payment_service.worker:main"

[dependency-groups]
dev = [
  "pre-commit>=4.4,<5",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "aiosqlite>=0.21,<1",
]

docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocstrings[python]>=0.30,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payment_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "D", "ANN", "T20", "RUF"]
ignore = ["D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D104"]
"migrations/**" = ["D104"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/payment_service"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
markers = ["integration: тесты с настоящими PostgreSQL и RabbitMQ"]

[tool.coverage.run]
source = ["payment_service"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "class .*\\bProtocol\\):", "raise NotImplementedError"]
