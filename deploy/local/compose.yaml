name: testtask

x-app: &app
  build:
    context: ../..
    target: production
  environment: &app-env
    DATABASE_URL: ${DATABASE_URL:?Укажите DATABASE_URL}
    DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
    DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
    DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-5}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  init: true
  read_only: true
  tmpfs: ["/tmp:size=16m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  stop_grace_period: 40s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-payments}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-payments}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Укажите RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  migrate:
    <<: *app
    environment:
      DATABASE_URL: ${DATABASE_URL:?Укажите DATABASE_URL}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      API_KEY: ${API_KEY:?Укажите API_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  consumer:
    <<: *app
    environment:
      <<: *app-env
      RABBITMQ_URL: ${RABBITMQ_URL:?Укажите RABBITMQ_URL}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-0.5}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      PUBLISH_TIMEOUT: ${PUBLISH_TIMEOUT:-5}
      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-5}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-2}
      WORKER_HEALTH_PORT: 8081
    command: ["payment-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  tests:
    profiles: ["test"]
    build:
      context: ../..
      target: test
    environment:
      <<: *app-env
      TEST_DATABASE_URL: ${DATABASE_URL:?Укажите DATABASE_URL}
      TEST_RABBITMQ_URL: ${RABBITMQ_URL:?Укажите RABBITMQ_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
